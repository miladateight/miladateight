<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Learning path: Docker, CI/CD, Infrastructure as Code, Kubernetes, Cloud, Observability.">
  <title>Path in progress — DevOps &amp; Cloud</title>

  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="900" height="150" rx="16"/></clipPath>

    <style>
      .mono { font-family: "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: "Segoe UI Variable Display", "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif; }
      .flow { stroke-dasharray: 8 10; animation: flow 2.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -36; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="150" fill="#06080d"/>

    <text x="40" y="38" class="mono" font-size="12.5" letter-spacing="3.4" fill="#8b99b3">PATH IN PROGRESS</text>

    <line x1="72" y1="106" x2="828" y2="106" stroke="#94a3b8" stroke-opacity="0.18" stroke-width="2"/>
    <line x1="72" y1="106" x2="828" y2="106" stroke="url(#track)" stroke-width="2" class="flow"/>

    <circle r="4.5" fill="#eef4ff">
      <animate attributeName="cx" values="72;828" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="106;106" dur="6s" repeatCount="indefinite"/>
    </circle>

    <g class="sans" font-size="15" text-anchor="middle" fill="#eef4ff">
      <text x="72" y="80">Docker</text>
      <text x="223" y="80">CI / CD</text>
      <text x="374" y="80">IaC</text>
      <text x="525" y="80">Kubernetes</text>
      <text x="676" y="80">Cloud</text>
      <text x="828" y="80">Observability</text>
    </g>

    <g fill="#0f1622" stroke-width="2.5">
      <circle cx="72" cy="106" r="8" stroke="#38bdf8"/>
      <circle cx="223" cy="106" r="8" stroke="#38bdf8"/>
      <circle cx="374" cy="106" r="8" stroke="#2dd4bf"/>
      <circle cx="525" cy="106" r="8" stroke="#2dd4bf"/>
      <circle cx="676" cy="106" r="8" stroke="#8b5cf6"/>
      <circle cx="828" cy="106" r="8" stroke="#8b5cf6"/>
    </g>

    <rect x="1" y="1" width="898" height="148" rx="16" fill="none" stroke="#94a3b8" stroke-opacity="0.16" stroke-width="2"/>
  </g>
</svg>
