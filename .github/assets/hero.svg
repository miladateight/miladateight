<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Milad Ateight — IT Lead. Infrastructure, networks, Linux, Windows Server, web and mail.">
  <title>Milad Ateight — IT Lead</title>

  <defs>
    <linearGradient id="name" x1="40" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#8fd8f7"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="frame"><rect width="900" height="230" rx="16"/></clipPath>

    <style>
      .mono { font-family: "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: "Segoe UI Variable Display", "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif; }
      .ring { animation: spin 28s linear infinite; transform-origin: 792px 115px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
    </style>
  </defs>

