<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Milad Ateight — IT Lead. Infrastructure, networks, Linux, Windows Server, web and mail systems.">
  <title>Milad Ateight — IT Lead, Infrastructure &amp; Networks</title>

  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.45" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#8b5cf6"/>
      <animate attributeName="x1" values="-300;620;-300" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="320;1240;320" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowSky" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="frame"><rect x="0" y="0" width="1200" height="400" rx="20"/></clipPath>

    <clipPath id="typeClip">
      <rect x="96" y="344" width="0" height="24">
        <animate attributeName="width" values="0;0;266;266;0" keyTimes="0;0.42;0.72;0.96;1" dur="11s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <style>
      .mono { font-family: "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: "Segoe UI Variable Display", "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif; }
      .link { animation: dash 3.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      .breathe { animation: breathe 5s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { opacity: .34 } 50% { opacity: .62 } }
      .ring { animation: spin 22s linear infinite; transform-origin: 946px 268px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .drift { animation: drift 14s linear infinite; }
      @keyframes drift { to { transform: translate(40px, 40px); } }
      @media (prefers-reduced-motion: reduce) {
        .link, .breathe, .ring, .drift { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#06080d"/>
    <g class="drift"><rect x="-40" y="-40" width="1280" height="480" fill="url(#grid)"/></g>

    <ellipse cx="180" cy="60" rx="420" ry="260" fill="url(#glowSky)" class="breathe"/>
    <ellipse cx="1080" cy="330" rx="400" ry="250" fill="url(#glowViolet)" class="breathe" style="animation-delay:-2.4s"/>
    <ellipse cx="700" cy="0" rx="360" ry="200" fill="url(#glowTeal)" class="breathe" style="animation-delay:-3.8s"/>

    <text x="60" y="88" class="sans" font-size="52" font-weight="700" letter-spacing="1.5" fill="url(#nameGrad)">MILAD ATEIGHT</text>
    <text x="62" y="118" class="mono" font-size="14.5" letter-spacing="3.4" fill="#8b99b3">IT LEAD &#183; INFRASTRUCTURE &#183; NETWORKS &#183; LINUX &#183; WEB &amp; MAIL</text>

    <g transform="translate(1054,26)">
      <circle cx="46" cy="46" r="45" fill="#0f1622" stroke="#38bdf8" stroke-opacity="0.35"/>
      <circle cx="46" cy="46" r="45" fill="none" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 10" class="link"/>
      <g transform="translate(46,46) scale(0.113) translate(-293,-274)">
        <path fill="#ffd21a" d="M253 66c88 0 151 48 151 121 0 39-22 73-58 94 47 20 75 58 75 108 0 82-69 132-168 132-100 0-169-50-169-132 0-50 28-89 75-108-36-21-58-55-58-94 0-73 64-121 152-121Zm0 263c-43 0-73 21-73 54 0 34 30 55 73 55 42 0 72-21 72-55 0-33-30-54-72-54Zm0-176c-38 0-65 19-65 49s27 49 65 49 65-19 65-49-27-49-65-49Z"/>
        <path fill="#ff1d18" d="M259 28h202c-10 33-15 66-15 100 38 1 75 5 111 13l-28 119-89-35v136c-61-24-99-78-116-162l-105-23c16-36 49-61 105-75-2-25-4-49-5-73Z" transform="translate(-70 2)"/>
      </g>
    </g>

    <rect x="60" y="136" width="1080" height="1.5" fill="url(#rule)" opacity="0.75"/>

    <g>
      <rect x="56" y="164" width="624" height="220" rx="14" fill="#0f1622" stroke="#94a3b8" stroke-opacity="0.16"/>
      <circle cx="84" cy="190" r="5" fill="#fb7185"/>
      <circle cx="102" cy="190" r="5" fill="#f59e0b"/>
      <circle cx="120" cy="190" r="5" fill="#2dd4bf"/>
      <text x="144" y="194" class="mono" font-size="12" fill="#65738d">ateight@at8 &#8212; zsh</text>
      <path d="M56 210H680" stroke="#94a3b8" stroke-opacity="0.14"/>

      <g class="mono" font-size="14.5">
        <g opacity="0">
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.96;1" dur="11s" repeatCount="indefinite"/>
          <text x="80" y="232" fill="#2dd4bf">$</text>
          <text x="96" y="232" fill="#eef4ff">whoami</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.10;0.15;0.96;1" dur="11s" repeatCount="indefinite"/>
          <text x="80" y="258" fill="#c6d1e4">milad ateight &#183; IT Lead @ EPC &#183; Iran</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.20;0.25;0.96;1" dur="11s" repeatCount="indefinite"/>
          <text x="80" y="284" fill="#2dd4bf">$</text>
          <text x="96" y="284" fill="#eef4ff">stack --top</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.33;0.96;1" dur="11s" repeatCount="indefinite"/>
          <text x="80" y="310" fill="#8b99b3">mikrotik &#183; linux &#183; nginx &#183; haproxy &#183; wireguard &#183; python</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.42;0.96;1" dur="11s" repeatCount="indefinite"/>
          <text x="80" y="336" fill="#2dd4bf">$</text>
          <text x="96" y="336" fill="#eef4ff">status --now</text>
        </g>
      </g>

      <g clip-path="url(#typeClip)">
        <text x="96" y="362" class="mono" font-size="14.5" fill="#38bdf8">building toward DevOps &amp; Cloud</text>
      </g>

      <rect x="96" y="348" width="8" height="17" fill="#38bdf8" opacity="0">
        <animate attributeName="x" values="96;96;358;358;96" keyTimes="0;0.42;0.72;0.96;1" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.41;0.42;0.96;1" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g>
      <rect x="704" y="164" width="440" height="220" rx="14" fill="#0f1622" stroke="#94a3b8" stroke-opacity="0.16"/>
      <text x="726" y="192" class="mono" font-size="11.5" letter-spacing="1.8" fill="#65738d">TOPOLOGY &#8212; DAILY SURFACE</text>
      <path d="M704 210H1144" stroke="#94a3b8" stroke-opacity="0.14"/>

      <g class="ring" opacity="0.5">
        <circle cx="946" cy="268" r="76" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-dasharray="4 12"/>
      </g>

      <g stroke-width="1.4" fill="none" stroke-dasharray="5 7" class="link">
        <path d="M946 268 L790 240" stroke="#38bdf8" stroke-opacity="0.55"/>
        <path d="M946 268 L790 312" stroke="#2dd4bf" stroke-opacity="0.55"/>
        <path d="M946 268 L946 340" stroke="#8b5cf6" stroke-opacity="0.55"/>
        <path d="M946 268 L1102 240" stroke="#38bdf8" stroke-opacity="0.55"/>
        <path d="M946 268 L1102 312" stroke="#2dd4bf" stroke-opacity="0.55"/>
        <path d="M946 268 L946 232" stroke="#f59e0b" stroke-opacity="0.5"/>
      </g>

      <g fill="#38bdf8">
        <circle r="3"><animateMotion dur="2.6s" repeatCount="indefinite" path="M946 268 L790 240"/></circle>
        <circle r="3" fill="#2dd4bf"><animateMotion dur="3.1s" begin="-1s" repeatCount="indefinite" path="M790 312 L946 268"/></circle>
        <circle r="3" fill="#8b5cf6"><animateMotion dur="2.2s" begin="-0.6s" repeatCount="indefinite" path="M946 268 L946 340"/></circle>
        <circle r="3"><animateMotion dur="2.9s" begin="-1.4s" repeatCount="indefinite" path="M1102 240 L946 268"/></circle>
        <circle r="3" fill="#2dd4bf"><animateMotion dur="3.4s" begin="-2s" repeatCount="indefinite" path="M946 268 L1102 312"/></circle>
      </g>

      <g class="mono" font-size="10.5" text-anchor="middle">
        <g>
          <circle cx="946" cy="268" r="27" fill="#131c2b" stroke="#38bdf8" stroke-opacity="0.8"/>
          <circle cx="946" cy="268" r="27" fill="none" stroke="#38bdf8" opacity="0.45" filter="url(#soft)"/>
          <text x="946" y="272" font-size="12" fill="#eef4ff" letter-spacing="0.5">AT8</text>
        </g>
        <g fill="#c6d1e4">
          <circle cx="790" cy="232" r="17" fill="#131c2b" stroke="#38bdf8" stroke-opacity="0.45"/><text x="790" y="244">WAN</text>
          <circle cx="790" cy="312" r="17" fill="#131c2b" stroke="#2dd4bf" stroke-opacity="0.45"/><text x="790" y="316">VPN</text>
          <circle cx="946" cy="340" r="17" fill="#131c2b" stroke="#8b5cf6" stroke-opacity="0.45"/><text x="946" y="344">MAIL</text>
          <circle cx="1102" cy="232" r="17" fill="#131c2b" stroke="#38bdf8" stroke-opacity="0.45"/><text x="1102" y="244">NGINX</text>
          <circle cx="1102" cy="312" r="17" fill="#131c2b" stroke="#2dd4bf" stroke-opacity="0.45"/><text x="1102" y="316">LINUX</text>
          <circle cx="946" cy="232" r="15" fill="#131c2b" stroke="#f59e0b" stroke-opacity="0.5"/><text x="946" y="236" font-size="9.5">ROS</text>
        </g>
      </g>
    </g>

    <rect x="0" y="396" width="1200" height="4" fill="url(#rule)"/>
    <rect x="1" y="1" width="1198" height="398" rx="20" fill="none" stroke="#94a3b8" stroke-opacity="0.14" stroke-width="2"/>
  </g>
</svg>
