    <text x="40" y="136" class="sans" font-size="18" fill="#c6d1e4">IT Lead &#8212; infrastructure, networks, Linux, Windows Server, web &amp; mail</text>

    <rect x="40" y="160" width="620" height="2" fill="url(#rule)">
      <animate attributeName="width" values="0;620;620" keyTimes="0;0.35;1" dur="6s" repeatCount="indefinite"/>
