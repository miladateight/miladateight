name: Generate contribution snake

on:
  schedule:
    - cron: "42 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Render contribution grid
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#38bdf8&color_dots=#e6ecf5,#a5d6e8,#5fb6dd,#2f8fc9,#0b6ba8
            dist/snake-dark.svg?color_snake=#2dd4bf&color_dots=#0f1622,#164e63,#0e7490,#22a6b3,#38bdf8

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Refresh the contribution snake"
          committer: Milad Ateight <miladateight@users.noreply.github.com>
          author: Milad Ateight <miladateight@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
